# Ausraeumen: 4 Glaeser kopfueber aus dem Oberkorb holen, umdrehen und
# aufrecht auf die Ablage stellen (docs/ausraeumen.md).
#
# Maschine, Korb, Glas und Schienenlage kommen aus config/spuelmaschine.yaml
# und config/scene_spuelmaschine.yaml. Hier stehen nur der Ablauf, die
# Zwischenablage zum Umgreifen, Griffe, Bewertung, Variation und Negativtest.
# Jeder Wert hat `src` (Schluessel aus `quellen`) oder ist `annahme`.
# Koordinaten: Kuechensystem (Boden z = 0, Korpusfront y = 0, +y in den Raum).
# Gelesen von ausraeumen/konfig.py.

quellen:
  scene_spuelmaschine: >-
    config/scene_spuelmaschine.yaml: Griff von oben am kopfueber stehenden
    Glas (TCP 88 mm ueber dem Glasrand), Kollisionsrand 5 mm, IK-Grenze 1 mm
  scene_greifdemo: >-
    config/scene.yaml (Greifdemo): Kontakt, Reibung, Greifkraft, Fingerantrieb,
    Geschwindigkeitsanteil, Toleranzen
  befund_umdrehen: >-
    docs/ausraeumen.md Abschnitt 2: Mit einem starren Griff von oben laesst
    sich das Glas nicht umdrehen und aufrecht abstellen (der Greifer zeigte
    danach nach oben, sein Koerper laege unter dem Glasboden); deshalb Umgreifen
    auf einer Zwischenablage auf einen Seitgriff
  auftrag: >-
    Auftrag: aufrecht am Ablageziel innerhalb 1 cm, gekippt < 10 Grad, kein
    Kontakt Arm-Korb/Tuer/Arbeitsplatte, uebrige Glaeser nicht > 5 mm
    verschoben; Variation Glaslage +-5 mm und +-3 Grad, Korbauszug +-1 cm

ablauf:
  # Slot -> Ablagepunkt (1-basiert, Reihenfolge der Bearbeitung). Hintere
  # Ablagereihe (y = -0,13) zuerst, damit der Seitgriff ueber die noch freien
  # vorderen Punkte zurueckfaehrt.
  zuordnung: {wert: [[1, 3], [2, 4], [3, 1], [4, 2]], src: annahme}
  ruhepose_grad:                                       # Start, Ende, Zwischenpunkt; Arm zur Platte/Korb hin
    wert: {joint1: -120.0, joint2: 10.0, joint3: 90.0, joint4: 0.0, joint5: 80.0, joint6: 0.0}
    src: annahme
  ruhepose_achse7_m: {wert: 0.05, src: annahme}

zwischenablage:
  # Zwei kleine Ablagematten auf der Arbeitsplatte, links und rechts der
  # Ablagepunkte: dort wird das Glas kopfueber abgestellt und seitlich neu
  # gegriffen (befund_umdrehen). Auf Plattenhoehe, weil der Griff von oben
  # hoeher nicht mehr erreichbar ist (J5 <= 95 Grad, docs/spuelmaschine.md).
  # Je Ablagepunkt die Matte auf derselben Seite des Roboterfusses: ein gerader
  # Weg quer vor dem Fuss vorbei riss ab (Gelenk 3 an der Grenze, docs/ausraeumen.md)
  matten_xy_m: {wert: [[0.58, -0.03], [0.98, -0.03]], src: annahme}
  je_ablage: {wert: [0, 1, 0, 1], src: annahme}       # Ablagepunkt 1..4 -> Matte (0 links, 1 rechts)
  oberkante_m: {wert: 0.865, src: annahme}             # Platte 0,86 + Matte 5 mm
  dicke_m: {wert: 0.005, src: annahme}
  kante_m: {wert: 0.10, src: annahme}                  # quadratisch, Glas Durchmesser 75 mm
  vorposition_m: {wert: 0.05, src: scene_spuelmaschine}  # wie ablage_vorposition_m (J5-Grenze)
  absetzen_luft_m: {wert: 0.002, src: scene_greifdemo}

seitgriff:
  # Greifer waagerecht, Finger schliessen waagerecht quer zur Anfahrrichtung.
  hoehe_ab_glasboden_m: {wert: 0.055, src: annahme}    # Glasmitte: kein Kippmoment, Hand 15 mm ueber der Platte
  tiefe_m: {wert: 0.015, src: annahme}                 # Glasmitte 15 mm vor dem TCP: Greiferkoerper 7,5 mm vom Glas
  vorposition_m: {wert: 0.10, src: annahme}            # Anfahrt waagerecht
  anheben_m: {wert: 0.04, src: annahme}                # Umdrehen braucht 67 mm Radius um die Greiferachse
  ablage_vorposition_m: {wert: 0.03, src: annahme}     # ueber dem Ablagepunkt, dann senkrecht absetzen
  absetzen_luft_m: {wert: 0.002, src: scene_greifdemo}
  rueckzug_m: {wert: 0.10, src: annahme}               # waagerecht vom Glas weg
  gier_kandidaten_grad:                                # Anfahrrichtung in der Ebene (0 = +x)
    wert: [270.0, 240.0, 300.0, 210.0, 330.0, 180.0, 0.0, 150.0, 30.0, 120.0, 60.0, 90.0]
    src: annahme

planung:
  wegpunkt_abstand_m: {wert: 0.01, src: scene_spuelmaschine}
  ptp_schritt_grad: {wert: 2.0, src: annahme}          # Pruefabstand der Gelenkfahrten
  # TCP-Grenzen je Wegstueck (ruckarmes Profil): ein 4-cm-Hub in 0,5 s regte
  # die Finger zu Schwingungen an, das Glas kippte im Griff um 9 Grad
  tcp_v_max_m_s: {wert: 0.10, src: annahme}
  tcp_a_max_m_s2: {wert: 0.10, src: annahme}
  gelenksprung_max_grad: {wert: 10.0, src: scene_spuelmaschine}
  roboter_rand_m: {wert: 0.005, src: scene_spuelmaschine}
  glas_rand_m: {wert: 0.002, src: annahme}             # getragenes Glas <-> Szene
  glas_abstand_ptp_m: {wert: 0.02, src: annahme}       # Roboter <-> ruhende Glaeser bei Gelenkfahrten
  # Getragenes Glas darf sich bei Gelenkfahrten hoechstens so weit neigen: ohne
  # Grenze drehte eine Fahrt (J1 146 Grad, J3 174 Grad) den Greifer um die
  # Anfahrachse, das Glas rutschte 11 mm in der Hand (Durchdringung 3,4 mm)
  glas_kipp_max_grad: {wert: 20.0, src: annahme}
  # Weg zur Ablage nach dem Umdrehen: zuerst gerade (Drehung nur um die
  # Senkrechte), sonst Gelenkfahrt mit Neigungsgrenze
  ablage_wege: {wert: [gerade, gelenk], src: annahme}
  ik_fehler_max_m: {wert: 0.001, src: scene_spuelmaschine}
  zwischenhub_m: {wert: [0.0, 0.08, 0.16], src: annahme}  # Zwischenpunkte ueber Start/Ziel einer Gelenkfahrt
  seed: {wert: 7, src: annahme}

greifer:
  # Fingerbreite wie config/robot.yaml (20 mm). Ein breiterer Aufsatz (50 mm)
  # wurde probiert und verworfen: groessere Wanderung des Glases in der Hand
  # (13 mm statt 1,6 mm), Zielfehler 9,7 mm (docs/ausraeumen.md Abschnitt 4)
  finger_breite_m: {wert: 0.020, src: annahme}
  # Greifkraft je Finger: 10 N statt 20 N der Greifdemo. Im Seitgriff kippt das
  # Glas beim Umdrehen leicht im Griff und drueckt die Fingerkante tiefer ins
  # (weiche) Kontaktmodell: 20 N -> 4,7 mm, 10 N -> 3,5 mm, 10 N mit langsamem
  # Umdrehen -> 2,3 mm (Grenze 3 mm). Halten: 2 x 1,0 x 10 N = 20 N gegen 2,45 N.
  greifkraft_n: {wert: 10.0, src: annahme}
  finger_ke: {wert: 2000.0, src: scene_greifdemo}
  finger_kd: {wert: 100.0, src: scene_greifdemo}
  haltezeit_s: {wert: 0.4, src: scene_greifdemo}
  oeffnung_offen_m: {wert: 0.100, src: annahme}        # Glas 75 mm + 2 x 12,5 mm
  geschwindigkeit_anteil: {wert: 0.6, src: scene_greifdemo}
  umdrehen_anteil: {wert: 0.3, src: annahme}           # Gelenk 6 beim Umdrehen: 30 % (13,5 Grad/s); 60 % -> 3,5 mm Fingerdurchdringung
  nachlauf_s: {wert: 1.0, src: scene_greifdemo}

simulation:
  dt_s: {wert: 0.002, src: scene_greifdemo}
  messintervall_schritte: {wert: 5, src: scene_greifdemo}
  ke: {wert: 2500.0, src: scene_greifdemo}
  kd: {wert: 100.0, src: scene_greifdemo}
  reibung_finger: {wert: 1.0, src: scene_greifdemo}
  reibung_glas: {wert: 0.6, src: scene_greifdemo}
  reibung_korb: {wert: 0.5, src: annahme}
  reibung_platte: {wert: 0.5, src: scene_greifdemo}
  reibung_torsion: {wert: 0.01, src: scene_greifdemo}

bewertung:
  ziel_toleranz_m: {wert: 0.01, src: auftrag}
  kippung_max_grad: {wert: 10.0, src: auftrag}
  nachbar_verschiebung_max_m: {wert: 0.005, src: auftrag}
  kontakt_max_m: {wert: 0.0001, src: scene_greifdemo}  # tiefer = Kontakt Arm <-> Korb/Tuer/Platte
  hub_min_m: {wert: 0.08, src: annahme}                # Glas mindestens so hoch aus dem Korb gehoben
  stehhoehe_toleranz_m: {wert: 0.005, src: scene_greifdemo}
  durchdringung_max_m: {wert: 0.003, src: scene_greifdemo}
  glas_v_max_m_s: {wert: 1.0, src: scene_greifdemo}

negativtest:
  # Glas 1 steckt in einem zu schmalen Halter: zwei Klemmbacken (Quader)
  # druecken von beiden Seiten mit Uebermass auf das Glas.
  glas: {wert: 1, src: annahme}
  uebermass_m: {wert: 0.003, src: annahme}             # je Seite ins Glas
  backe_hoehe_m: {wert: 0.08, src: annahme}
  backe_reibung: {wert: 1.5, src: annahme}
