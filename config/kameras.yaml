auswahl:
  # Simulation (Raycast, 5 Rauschseeds x 3 Roboterposen), Aufbau ohne Ueberstand, Oberkorb ausgezogen
  empfehlung:
    kamera: b57_farbe
    montage: Mast rechts auf der Platte, Kamera (0,55; 0,40; 1,15) m ueber der Korbfront, 60 Grad geneigt
    abstand_m: [0.62, 0.80]                 # Glaeser 0,62-0,80, Teller 0,66-0,84 (untere Tellerflaechen ausserhalb)
    begruendung: >-
      Glaeser 96 % auf <= 5 mm aus dem Farbbild, Teller 71 % (Arm verdeckt den Rest); gleich gut wie die
      C57-S am selben Ort, guenstiger und kompakter. Mast unter 1,15 m stoesst an den Arm.
  sparvariante:
    kamera: n46_604_16
    montage: wie Empfehlung
    begruendung: >-
      Teller gleich gut, Glaeser ohne Farbbild nur 23 % auf <= 5 mm; nur zusammen mit der Nahkamera am
      Greifer, die die Glaslage vor dem Griff nachmisst.
