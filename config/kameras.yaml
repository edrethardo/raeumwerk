# Kamerakatalog: Ensenso-Kandidaten fuer den Aufbau "Roboter auf der Spuelmaschine ohne Ueberstand"
# (Oberkorb ausgezogen, Glaeser und Dessertteller gemischt). Datenblattwerte mit Quelle; "unklar" =
# in den lesbaren Quellen nicht angegeben. IDS-Seiten stehen hinter einer Bot-Pruefung: Werte stammen
# aus Distributor-Seiten, dem Ensenso-Handbuch und Suchauszuegen. Preise: EUR = "ab"-Preis des
# Herstellers (Grundkonfiguration, netto), USD = Listenpreis eines US-Haendlers (nur Plausibilitaet).
#
# sigma_k: Tiefenrauschen sigma(z) = sigma_k * z^2 (z in m, sigma in m), aus der z-Genauigkeit des
# Datenblatts angepasst. Die z-Genauigkeit des Herstellers rechnet nur die Geometrie (Disparitaet
# 1/4 px Einzelaufnahme, 1/8 px FlexView, Quelle selector_formel); auf nassem Geschirr und Glas ist
# das echte Rauschen groesser.
