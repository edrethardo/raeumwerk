# Vorhersagekatalog für den ersten Kameratag (Ensenso C57-6-S, Artikel 1009348; D405 am Handgelenk).
#
# EINGEFROREN: Dieser Katalog wird nach dem Einfrieren nicht mehr geändert. Messergebnisse kommen
# in eine eigene Datei (Ausgabe von scripts/kameratag_auswerten.py), nie hierher.
# Herkunft jeder Zahl: D = Datenblatt, M = Modell (gerechnet, nicht gemessen), A = Annahme (ohne Messbeleg).
# Alle Modellzahlen stammen aus den Rechnungen in docs/ (Verweis je Zeile) und sind hier nicht neu gerechnet;
# einzige neue Rechnung: Zeile 8, Pose-Streuung (Abschnitt dort).
katalog_version: 1
stand: "2026-11-05"
status: eingefroren
sprache: de
kamera: {station: "Ensenso C57-6-S (Artikel 1009348)", handgelenk: "Intel RealSense D405"}
herkunft_schluessel: {D: Datenblatt, M: Modell, A: Annahme}
verdikte: [stimmt, zu_optimistisch, zu_pessimistisch]
verdikt_regel: >-
  zu_optimistisch = die Wirklichkeit ist schlechter als das Modell sagt (Modell zu schön);
  zu_pessimistisch = die Wirklichkeit ist besser als das Modell sagt;
  unbekannt = es gibt keine Vorhersage, nur eine Einordnung des Messwerts.
nicht_vorhersagbar: [nasse_optik, projektorreflexe_metallkorb, ensenso_auf_glas]

# Reihenfolge des ersten Tages (aus docs/sensitivitaet.md, Top 5; Aufwand dort Annahme):
# 1 Randdicke, 2 Kalibrierung Station, 3 Erkennung bei Licht, 4 Tellerlage/-gier, 5 D405-Rauschen.
messreihenfolge:
  - {nr: 1, messung: m1, zeilen: [11], titel: "Randdicke der echten Dessertteller + Ensenso-Aufnahmen der Tellerreihe", minuten: 20, quelle: P4}
  - {nr: 2, messung: m2, zeilen: [12], titel: "Kalibrierung Station: Versatz und Drehung", minuten: 45, quelle: P4}
  - {nr: 3, messung: m3, zeilen: [6, 5], titel: "Erkennungsrate bei Tag / Küche / dunkel", minuten: 75, quelle: P4}
  - {nr: 4, messung: m4, zeilen: [9, 10, 13], titel: "Tellerlage und -gier im Ständer (und Glaslage)", minuten: 35, quelle: P4}
  - {nr: 5, messung: m5, zeilen: [1], titel: "D405-Rauschen am Teller", minuten: 15, quelle: P4}

zeilen:
  # ------------------------------------------------------------------------------------------------
  - id: 1
    name: Tiefenrauschen
    einheit: mm
    prioritaet: {p4_rang: 5, text: "D405-Rauschen ist Nr. 5 der Messreihenfolge (ST 0,12 bei K, 0,01 bei B); Ensenso-Rauschen im Modell wirkungslos (ST <= 0,03)"}
    aufwand: {minuten: 15, quelle: P4, hilfsmittel: ["ebene matte Platte", "2 Abstände", "je 5 Aufnahmen D405"], ensenso_zusatz: "10 min (Annahme): matte ebene Wand, 3 Abstände, je 3 Aufnahmen"}
    vorhersage:
      text: "Ensenso sigma(z) = 0,219 mm * z^2 (z in m): 0,147 mm bei 0,82 m, 0,219 mm bei 1,0 m, 0,315 mm bei 1,20 m. D405 sigma(z) = 20 mm * z^2: 0,8 mm bei 0,2 m, 1,8 mm bei 0,3 m, 3,2 mm bei 0,4 m."
      herkunft:
        - {art: D, text: "Ensenso: Z-Genauigkeit 0,123 / 0,219 / 0,46 mm bei 0,75 / 1,0 / 1,45 m (config/kameras.yaml, c57_6_s); die Form k*z^2 reproduziert alle drei Werte"}
        - {art: A, text: "Das Datenblatt nennt eine Genauigkeit; dass sie dem Streuwert eines Ebenenfits (sigma der Residuen) entspricht, ist eine Annahme"}
        - {art: A, text: "D405: k = 0,02 1/m aus der Kamerastudie, nicht aus dem Datenblatt belegt (wahrnehmung/sensor.py)"}
      band: "Ensenso: Faktor 0,5 bis 2 um den Modellwert (obere Grenze 2x aus dem Entwurf, untere Grenze 0,5x ist eine Annahme zur Symmetrie)."
    schwelle: "stimmt, wenn sigma_gemessen / sigma_Modell(z) zwischen 0,5 und 2 liegt (Ensenso wie D405)"
    parameter:
      ensenso: {k_mm_pro_m2: 0.219, faktor_hoch: 2.0, faktor_tief: 0.5}
      d405: {k_mm_pro_m2: 20.0, faktor_hoch: 2.0, faktor_tief: 0.5}
    urteil:
      stimmt: "Faktor 0,5 bis 2 gegenüber sigma(z)."
      zu_optimistisch: "Gemessenes Rauschen mehr als doppelt so groß wie sigma(z)."
      zu_pessimistisch: "Gemessenes Rauschen weniger als halb so groß; die Ebenenfläche selbst (Unebenheit der Platte) begrenzt die Auflösung dieser Messung nach unten."
    konsequenz:
      stimmt: "Fehlermodell behalten."
      zu_optimistisch:
        - {ab: 0, text: "Ensenso: im Modell hat das Station-Rauschen zwischen 0,5x und 3x keine Wirkung (ST <= 0,03); bis 3x kein Entscheidungsgrund. Erst Belichtung, Projektorhelligkeit und Oberfläche der Platte prüfen, dann erneut messen."}
        - {ab: 3.0, text: "Ensenso über 3x: außerhalb der gerechneten Spanne; Sensitivitätsrechnung mit dem gemessenen Faktor neu laufen lassen."}
      zu_pessimistisch: "Das Modell ist eine obere Schranke: rausch_ens im Fehlermodell auf den gemessenen Faktor setzen, sonst nichts ändern."
    konsequenz_d405: "D405 mehr als doppelt so verrauscht (Faktor >= 2): Kette K bricht ab (Teller K 33 %, unbemerkt 17 %), A bei 2x 50 % mit 50 % unbemerkt, bei 3x 0 % mit 100 % unbemerkt; B bleibt 100 % (Modell, 6 Seeds, docs/sensitivitaet.md). Folge: A für den Teller nicht freigeben, B oder Abbruch."

  # ------------------------------------------------------------------------------------------------
  - id: 2
    name: Abstände Mast zu Referenzpunkten
    einheit: m
    prioritaet: {p4_rang: null, text: "nicht in der Top 5; Mastort im Modell ohne Wirkung (ST ~ 0), Vorbehalt: Verdeckung und Einfallswinkel gehen nicht ein"}
    aufwand: {minuten: 30, quelle: A, hilfsmittel: ["Laser-Entfernungsmesser oder Maßband", "Stativ mit Neigungsmesser", "Markierungen R1 bis R3"], hinweis: "Aufbau und Einmessen je Position; gehört zu m0"}
    vorhersage:
      text: "Je Position Abstand Kameraursprung zu R1 (Mitte Plattenvorderkante, Oberseite), R2 (Mitte Oberkorb-Front am Boden bei 0,45 m Auszug), R3 (Mitte Unterkorb-Front am Boden bei 0,45 m Auszug); Werte siehe positionen.<name>.referenz. Haupt 0,80 / 0,91 / 1,18 m, einfacher Ausleger 0,75 / 0,93 / 1,21 m, höher 0,91 / 1,10 / 1,37 m, Bestand 0,71 / 0,97 / 1,25 m."
      herkunft:
        - {art: M, text: "Geometrie aus config/spuelmaschine.yaml und der Kameraposition (docs/stationssichtbarkeit.md, Vorhersagezeilen)"}
        - {art: A, text: "Band +-2 cm aus dem Entwurf; keine Herleitung (Ablesung am Gehäuse, Lage des optischen Zentrums im Gehäuse nicht geklärt)"}
        - {art: A, text: "Die Zahlen des Entwurfs (Oberkorb 0,82 bis 0,98 m, Unterkorb 1,02 bis 1,20 m) sind für die Hauptposition ersetzt"}
      band: "+-20 mm je Referenzpunkt (A)"
    schwelle: "stimmt, wenn |gemessen - Modell| <= 20 mm an allen drei Referenzpunkten"
    parameter: {tol_mm: 20.0, schlechter: groesser}
    urteil:
      stimmt: "Alle drei Abweichungen <= 20 mm."
      zu_optimistisch: "Mindestens ein Punkt mehr als 20 mm weiter weg als im Modell (Betriebsabstand und Rauschen schlechter)."
      zu_pessimistisch: "Mindestens ein Punkt mehr als 20 mm näher als im Modell; prüfen, ob Platz-z unter 0,80 m fällt (Reserve zur Betriebsgrenze 0,75 m)."
    konsequenz:
      stimmt: "Positionstabelle bleibt Grundlage für Zeilen 3 und 4."
      zu_optimistisch: "Kamerapose oder Maschinengeometrie (Plattenhöhe, Auszuglänge, Korbhöhe) weicht ab: Mastposition mit den gemessenen Maßen neu rechnen (scripts/mast_raster.py); bis dahin Betriebsbereich 0,75 bis 1,50 m aus den gemessenen Abständen prüfen, Punkte außerhalb gelten als nicht gemessen."
      zu_pessimistisch: "Wie zu optimistisch; zusätzlich Unterschreitung 0,75 m prüfen (nahe Plätze werden dann nicht gemessen)."

  # ------------------------------------------------------------------------------------------------
  - id: 3
    name: Bildausschnitt
    einheit: mm
    prioritaet: {p4_rang: null, text: "nicht in der Top 5; fällt aus den Aufnahmen von m0/m1 ab"}
    aufwand: {minuten: 10, quelle: A, hilfsmittel: ["ebene helle Wand oder Platte", "Laser-Entfernungsmesser", "Maßband"], hinweis: "Wandaufnahme bei 1,0 m; Korbecken aus den Aufnahmen von m1"}
    vorhersage:
      text: "Sichtfeld 954 x 867 mm bei 1 m (linear in z). An der mittleren Platzebene bei 0,45 m Auszug: Haupt Oberkorb 828 bis 892 x 753 bis 811 mm, Unterkorb 1046 x 950 mm. Ecken der Korbhülle im Bild (von 8): Haupt 8 (0,225 m) / 7 (0,45 m), höher 8 / 8, Bestand 7 / 6, einfacher Ausleger 7 / 7. Details je Position in positionen.<name>.gruppen."
      herkunft:
        - {art: D, text: "Arbeitsvolumen 954 x 867 mm bei 1 m (config/kameras.yaml)"}
        - {art: M, text: "Ecken und Anteile im Bild aus dem Strahlschnitt (docs/stationssichtbarkeit.md); Unterkante des Unterkorbs liegt an der Hauptposition am Bildrand"}
        - {art: A, text: "Ob die Punktwolke (Überlappung beider Stereobilder) das volle Arbeitsvolumen abdeckt, ist nicht belegt; das Modell nimmt das Bild des Sensors an"}
      band: "Sichtfeld +-5 % (A); Eckenzahl +-1 (A, die Unterkante liegt an der Hauptposition am Bildrand)"
    schwelle: "stimmt, wenn gemessenes Sichtfeld bei 1 m innerhalb 5 % um 954 x 867 mm liegt und die Zahl der Korbecken im Bild um höchstens 1 abweicht"
    parameter:
      fov_1m_mm: [954.0, 867.0]
      tol_rel: 0.05
      ecken_tol: 1
      ecken_im_bild:
        haupt: {a225: 8, a450: 7}
        hoeher: {a225: 8, a450: 8}
        bestand: {a225: 7, a450: 6}
        ausleger: {a225: 7, a450: 7}
    urteil:
      stimmt: "Sichtfeld innerhalb 5 % und Eckenzahl innerhalb 1."
      zu_optimistisch: "Sichtfeld kleiner als 95 % des Modells oder mehr als eine Ecke weniger im Bild als gerechnet."
      zu_pessimistisch: "Sichtfeld größer als 105 % oder mehr als eine Ecke mehr im Bild."
    konsequenz:
      stimmt: "Bildlage wie gerechnet."
      zu_optimistisch: "Neigung nachstellen (55 / 60 Grad sind am Kameratag ohne Umbau verstellbar, docs/stationssichtbarkeit.md) und Aufnahme wiederholen; bleibt eine Ecke fehlen, gelten die Plätze am Bildrand (Unterkorb unten) als nicht erfasst und Zeile 4 wird mit der tatsächlichen Bildlage ausgewertet."
      zu_pessimistisch: "Keine Änderung nötig; Sichtfeld-Parameter in config/kameras.yaml auf den gemessenen Wert setzen."

  # ------------------------------------------------------------------------------------------------
  - id: 4
    name: Sichtbarkeit je Platz
    einheit: "Plätze nutzbar (n von N); sichtbare Fläche in %"
    prioritaet: {p4_rang: null, text: "nicht in der Top 5; Entscheidung Haupt gegen einfachen Ausleger hängt an der Randdicke (Zeile 11)"}
    aufwand: {minuten: 40, quelle: A, hilfsmittel: ["Stativ", "Auszugsmarkierungen 0,225 / 0,45 m", "Ensenso-Aufnahmen je Auszug"], hinweis: "je Position; die Aufnahmen entstehen mit m1"}
    vorhersage:
      text: "Zählung 'Fläche' (nutzbar), 16 Gläser, 8 Oberkorb-Teller, 6 Unterkorb-Teller, Auszug 0,225 / 0,45 m. Haupt: Gläser 16 / 16, Oberkorb-Teller 8 / 5, Unterkorb-Teller 5 / 0. Einfacher Ausleger: Gläser 16 / 16, Oberkorb-Teller 8 / 1, Unterkorb-Teller 1 / 0. Höher: 16 / 16, 8 / 2, 1 / 0. Bestand: Gläser 12 / 16, Oberkorb-Teller 5 / 0, Unterkorb-Teller 0 / 0. Mit Rand-Zählung (obere Schranke) an allen Positionen fast alle Teller. Je Platz sichtbarer Anteil, Abstand und Einfallswinkel in positionen.<name>.plaetze."
      herkunft:
        - {art: M, text: "Strahlschnitt mit Verdeckung durch Stäbe, Rahmen, Nachbarn, Kamerakörper; Glas als Silhouette (docs/stationssichtbarkeit.md)"}
        - {art: A, text: "Nutzbar-Kriterium (Glas >= 30 Konturpixel, Teller >= 60 Punkte, Einfallswinkel < 60 Grad, Konturbogen >= 40 Grad) sind Annahmen der Schätzer, nicht gemessen"}
        - {art: A, text: "Ob die Rand-Zählung oder die Flächen-Zählung gilt, entscheidet die Randdicke (Zeile 11)"}
      band: "Anzahl +-1 (A); sichtbarer Anteil +-15 Prozentpunkte im Mittel (A)"
    schwelle: "stimmt, wenn je Gruppe und Auszug die Zahl nutzbarer Plätze um höchstens 1 von der Vorhersage abweicht (Summe der Abweichungen je Gruppe geprüft)"
    parameter:
      tol_zahl: 1
      tol_sichtbar_pp: 15.0
      min_punkte_teller: 240
      min_punkte_hinweis: "60 Punkte auf Schätzerskala 2 entsprechen bei voller Auflösung etwa 240 Punkten (Annahme: 4 Pixel je Schätzerpunkt)"
    urteil:
      stimmt: "Je Gruppe und Auszug höchstens ein Platz Abweichung; mittlere Abweichung der sichtbaren Fläche <= 15 Prozentpunkte."
      zu_optimistisch: "Mehr als ein Platz weniger nutzbar als gerechnet (oder sichtbare Fläche im Mittel mehr als 15 Prozentpunkte niedriger)."
      zu_pessimistisch: "Mehr als ein Platz mehr nutzbar (oder sichtbare Fläche mehr als 15 Prozentpunkte höher)."
    konsequenz:
      stimmt: "Plätze aus der Tabelle als Planungsgrundlage verwenden."
      zu_optimistisch: "Fehlende Plätze namentlich notieren: dort Lage aus dem Slot (Mechanik-Prior B) und Kamera nur zur Anwesenheitsprüfung. Fehlt fast ein ganzer Korb, Mastposition wechseln (Haupt gegen einfachen Ausleger) und Reihe wiederholen."
      zu_pessimistisch: "Mehr Plätze als gerechnet: Modell ist obere Hürde; Planung unverändert, Unterschiede der Zählung (Rand gegen Fläche) in der Auswertung vermerken."

  # ------------------------------------------------------------------------------------------------
  - id: 5
    name: Punktabdeckung je Objekt
    einheit: "% der Objektpixel mit gültigem Tiefenwert"
    prioritaet: {p4_rang: 3, text: "mit Messung 3 (Erkennung bei Licht) zusammen aufgenommen; Teller-Punktabdeckung hängt an Zeile 11"}
    aufwand: {minuten: 0, quelle: A, hilfsmittel: ["Aufnahmen aus m3 und m1", "Maske je Objekt (Handlabel oder Erkennung)"], hinweis: "keine eigene Aufnahme; Auswertung der Wolken mit Maske"}
    vorhersage:
      text: "Glas im Mittel 31 % (Streuung der Objekte P10 bis P90: 27 bis 38 %). Teller im Mittel 29 % trocken / 28 % nass (Bootstrap 25 bis 31 %), Median 18 bis 19 %, P10 bis P90 11 bis 85 % (zweigipflig: flach gesehene Teller wenig, steiler gesehene viel). Glas nass wird nicht vorhergesagt (siehe unbekannt 1 und 3)."
      herkunft:
        - {art: M, text: "Strahlschnitt mit angenommenem Fehlermodell, 72 Szenen (docs/kameratag-p3.md, Punktabdeckung)"}
        - {art: A, text: "Fehlermodell Glas: 50 % Ausfall, 35 % Durchblick, 15 % Reflex; Nässe 5 % Ausfall - Annahmen (wahrnehmung/sensor.py); Projektormuster und Stereo-Matching nicht simuliert"}
        - {art: A, text: "'Glas nass = Glas trocken' im Modell ist durch das Fehlermodell bedingt, kein Ergebnis"}
      band: "Glas 31 % +-8 Prozentpunkte, Teller 29 % +-8 Prozentpunkte als Mittel über mindestens 8 Objekte (A: Fenster ist größer als die Bootstrap-Breite, weil das Fehlermodell nicht gemessen ist)"
    schwelle: "stimmt, wenn der Mittelwert über >= 8 Objekte der Klasse innerhalb des Fensters liegt"
    parameter:
      glas: {mittel: 31.0, fenster: [23.0, 39.0]}
      teller: {mittel: 29.0, fenster: [21.0, 37.0], median: 19.0}
      min_objekte: 8
    urteil:
      stimmt: "Mittel im Fenster."
      zu_optimistisch: "Mittel unter dem Fenster (weniger Tiefenpunkte als gerechnet)."
      zu_pessimistisch: "Mittel über dem Fenster (mehr Tiefenpunkte als gerechnet)."
    konsequenz:
      stimmt: "Fehlermodell von Glas und Teller bleibt."
      zu_optimistisch: "Glas: Pose aus der Kontur (RGB-Maske) plus D405 statt aus Ensenso-Tiefe; Zeile 5 versagt: Glas aus Slot-Position schätzen, Kamera nur zur Prüfung (Mechanik-Prior B). Teller: Randdicke (Zeile 11) und Einfallswinkel (Zeile 4) als Ursache prüfen, Teller aus Slot-Position."
      zu_pessimistisch: "Mehr Punkte als gerechnet: Ensenso kann auch auf Glas oder Teller verwertbare Tiefe liefern; Fehlermodell-Raten anpassen und Zeile 7 (Lagegenauigkeit) mit den Wolken prüfen."

  # ------------------------------------------------------------------------------------------------
  - id: 6
    name: Erkennung (Trefferquote, Nachbarverwechslung)
    einheit: "% der sichtbaren Objekte (IoU >= 0,5)"
    prioritaet: {p4_rang: 3, text: "Messung 3 (75 min); größter Treiber für Glas (ST a 0,31 bis 0,95)"}
    aufwand: {minuten: 75, quelle: P4, hilfsmittel: ["20+ Aufnahmen bei Tag / Küche / dunkel", "Handlabel (Objektmasken)", "Erkennungslauf (scripts/p3_erkennen.py)"]}
    vorhersage:
      text: "Klassische Baseline, Treffer: Glas 55 % (95 %: 49 bis 61), Tag 86 % (78 bis 91), Küche 66 % (55 bis 75), dunkel 0 % (0 bis 5); Teller 45 % (41 bis 50), Tag 52 %, Küche 54 %, dunkel 31 % (24 bis 38). Nachbarverwechslung/Verschmelzung: Glas 9 %, Teller 16 %. Mask R-CNN (COCO, ungetunt): Glas 31 % (26 bis 37), Teller 0 % klassenrichtig."
      herkunft:
        - {art: M, text: "Isaac-Renderbilder, 72 Szenen, 727 Objekte (docs/kameratag-p3.md); Wilson-Intervall 95 % aus den Renderdaten"}
        - {art: A, text: "Übertragbarkeit auf echte Bilder nicht belegt (Domänenlücke: Kalk, Gravur, Spiegelungen, Bildrauschen, Projektormuster fehlen); Licht 'dunkel' ist nur über den mittleren Grauwert des Renderbilds definiert (Tag 182 bis 194, Küche 86 bis 101, dunkel 14 bis 18 von 255)"}
        - {art: A, text: "Baseline kennt Nennmaße und Kamerapose (Suchfenster); sie ist keine blinde Erkennung"}
    schwelle: "stimmt, wenn der Modellwert im 95-%-Wilson-Intervall der gemessenen Rate k/n liegt"
    band: "Wilson 95 % aus den Renderdaten; am Kameratag Wilson 95 % aus k/n. Bei n = 20 ist das Intervall etwa +-20 Prozentpunkte breit, das Urteil dann schwach."
    parameter:
      raten:
        glas_alle: {p: 0.55, lo: 0.49, hi: 0.61, besser: hoeher}
        glas_tag: {p: 0.86, lo: 0.78, hi: 0.91, besser: hoeher}
        glas_kueche: {p: 0.66, lo: 0.55, hi: 0.75, besser: hoeher}
        glas_dunkel: {p: 0.0, lo: 0.0, hi: 0.05, besser: hoeher}
        teller_alle: {p: 0.45, lo: 0.41, hi: 0.50, besser: hoeher}
        teller_tag: {p: 0.52, lo: 0.44, hi: 0.60, besser: hoeher}
        teller_kueche: {p: 0.54, lo: 0.46, hi: 0.62, besser: hoeher}
        teller_dunkel: {p: 0.31, lo: 0.24, hi: 0.38, besser: hoeher}
        nachbar_glas: {p: 0.09, n_modell: 270, besser: niedriger}
        nachbar_teller: {p: 0.16, n_modell: 457, besser: niedriger}
        maskrcnn_glas_alle: {p: 0.31, lo: 0.26, hi: 0.37, besser: hoeher}
        maskrcnn_teller_klassenrichtig: {p: 0.0, lo: 0.0, hi: 0.01, besser: hoeher}
    urteil:
      stimmt: "Modellrate liegt im Wilson-Intervall der Messung."
      zu_optimistisch: "Gemessene Treffer liegen (Intervall) unter der Modellrate bzw. Nachbarverwechslung darüber."
      zu_pessimistisch: "Gemessene Treffer liegen über der Modellrate bzw. Verwechslung darunter."
    konsequenz:
      stimmt: "Erkennungsrate der Baseline als Erwartung für die Kette verwenden (Glas bei Tag etwa 80 % Griffe, docs/sensitivitaet.md)."
      zu_optimistisch: "Beleuchtung sicherstellen (Tag / Küche hell), Suchfenster auf den Nennort einengen, Glas im Dunkeln nicht einplanen. Liegt die Glas-Rate bei Tag deutlich unter 86 %: Erkennung vor jeder Griffplanung nachziehen (Feintuning auf eigenen Bildern); Kette B (Prior) braucht die Erkennung nur zur Prüfung. Teller-Rate unter 45 %: Teller aus Slot-Position (B)."
      zu_pessimistisch: "Erkennung besser als gerechnet: nichts ändern, Planwerte (Glas 0,55 / Teller 0,45) in der Sensitivitätsrechnung hochsetzen."

  # ------------------------------------------------------------------------------------------------
  - id: 7
    name: Lagegenauigkeit gegen Referenz
    einheit: mm
    prioritaet: {p4_rang: null, text: "nicht in der Top 5; folgt aus Zeile 12 (Kalibrierfehler) und Zeile 6 (Maske)"}
    aufwand: {minuten: 20, quelle: A, hilfsmittel: ["Lehre/Schablone auf dem Korb (Referenzlage +-1 mm, Annahme)", "Pose-Schätzer auf den Aufnahmen", "Kalibriertafel 390 x 390 mm als Ebenenreferenz"], hinweis: "Zusatzmessung m6"}
    vorhersage:
      text: "Fehler der Schätzpose gegen die Referenz, mit wahrer Maske und Fehlermodell: Glas Median 1,4 mm, P90 2,5 mm (92 % freigegeben); Teller bei 5 mm Randdicke Median 3,3 mm, P90 4,6 mm (96 von 131 freigegeben). Mit erkannter Baseline-Maske: Glas Median 1,5 / P90 2,3 mm, aber nur 14 % freigegeben; Teller 4 von 131 (Median 4,0 mm). Teller bei 12 mm Randdicke: 0 von 131."
      herkunft:
        - {art: M, text: "Strahlschnitt-Simulator, wahre Maske (docs/kameratag-p3.md, Lagefehler)"}
        - {art: A, text: "Kalibrierfehler der Station nicht eingerechnet; Zeile 12 kommt hinzu. Referenzlage am Korb +-1 mm ist eine Annahme"}
        - {art: A, text: "Teller 3,3 mm hängt an der angenommenen Randdicke 5 mm (Zeile 11)"}
      band: "Schwelle <= 5 mm (Entwurf, A); Modell pessimistisch, wenn Median < halber Modellwert"
    schwelle: "stimmt, wenn der Median des Lagefehlers <= 5 mm (Entwurf) und mindestens halb so groß wie der Modellwert ist"
    parameter:
      glas: {median: 1.4, p90: 2.5, freigegeben: 0.92}
      teller: {median: 3.3, p90: 4.6, freigegeben: 0.73}
      schwelle_mm: 5.0
      faktor_tief: 0.5
    urteil:
      stimmt: "Median zwischen halbem Modellwert und 5 mm."
      zu_optimistisch: "Median über 5 mm."
      zu_pessimistisch: "Median unter dem halben Modellwert."
    konsequenz:
      stimmt: "Pose aus der Station als Grobpose für den Griff verwendbar."
