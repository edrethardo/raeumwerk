unbekannt:
  - id: u1
    name: Nasse Optik (Wasserfilm, Tropfen auf Glas, Teller und Korb)
    zeilen: [5, 6, 7]
    begruendung: "Das Modell kennt nur 5 % zufälligen Ausfall auf nassen Flächen und Tropfen als Geometrie im Renderbild; ein Wasserfilm, Dampf, Wasserflecken und nasse Mehrfachspiegelungen im Gitter sind nicht modelliert. Die Renderdaten zeigen sogar widersprüchliche Richtungen (Baseline Glas nass 61 % gegen trocken 52 %, Mask R-CNN nass 18 % gegen trocken 40 %). Eine Zahl wäre erfunden."
    messgroesse: "Differenz der Erkennungsrate nass minus trocken (Prozentpunkte), gleiche Plätze, gleiche Beleuchtung"
    klassen_gruppe: delta_erkennung_pp
    klassen:
      - {bis: -30.0, name: "C", text: "Nässe zerstört die Erkennung (mehr als 30 Prozentpunkte schlechter). Folge: Erkennung nur im trockenen Zustand verlassen; im nassen Betrieb Lage aus dem Slot (B), Kamera nur zur Prüfung; Trocknungszeit oder Abtropfpause als Betriebsregel prüfen."}
      - {bis: -10.0, name: "B", text: "Nässe schwächt die Erkennung deutlich (10 bis 30 Prozentpunkte). Folge: Zeile 6 in der Nässe nur mit den nassen Raten planen; Prior B bevorzugen."}
      - {bis: 1000.0, name: "A", text: "Nässe kostet höchstens 10 Prozentpunkte. Folge: Erkennung im nassen Zustand wie trocken einplanen; Zeile 5 nass einzeln prüfen."}
  - id: u2
    name: Projektorreflexe im Metallkorb
    zeilen: [4, 5, 7]
    begruendung: "Die Ensenso projiziert ein Muster (200 W LED); Korbdrähte aus Metall spiegeln es. Projektormuster und Stereo-Matching sind weder im Strahlschnitt noch im Renderbild simuliert (docs/kameratag-p3.md); wie viele Fehlpunkte entstehen, ist nicht vorhersagbar."
    messgroesse: "Anteil von Tiefenpunkten im Korb-Bereich, die mehr als 10 mm neben der lokalen Ebene bzw. dem erwarteten Drahtvolumen liegen (Prozent)"
    klassen_gruppe: ausreisser_pct
    klassen:
      - {bis: 2.0, name: "A", text: "Unter 2 % Ausreißer. Folge: Reflexe ignorieren, Pose-Schätzer unverändert."}
      - {bis: 10.0, name: "B", text: "2 bis 10 % Ausreißer. Folge: Korbdrähte per Maske (Tiefe außerhalb der Objektmaske) ausblenden und Punkte nur aus der Objektmaske nehmen; Zeilen 5 und 7 mit Maske auswerten."}
      - {bis: 1000.0, name: "C", text: "Über 10 % Ausreißer. Folge: Kameraposition oder Winkel ändern (Spiegelung hängt am Einfallswinkel), Belichtung senken, Korb im Projektorfeld abdecken; reicht das nicht, Ensenso im Korb nur für die Anwesenheit nutzen und Lage aus D405 plus Slot."}
  - id: u3
    name: Ensenso auf transparentem Glas
    zeilen: [5, 7]
    begruendung: "Das Modell nimmt für Glas 50 % Ausfall, 35 % Durchblick, 15 % Reflex als Fehlermodell an (Annahmen); das Isaac-Tiefenbild sieht Glas ideal und ist bewusst nicht verwendet. Wie ein Stereo-Sensor mit Projektor ein echtes Weinglas sieht, ist nicht vorhersagbar. Der Modellwert von 31 % in Zeile 5 ist eine Folge dieser Annahmen, keine Vorhersage."
    messgroesse: "Punktabdeckung des Glases (Prozent der Objektpixel mit gültigem Tiefenwert), trocken, Mittel über mindestens 8 Gläser"
    klassen_gruppe: abdeckung_glas_pct
    klassen:
      - {bis: 5.0, name: "C", text: "Unter 5 %: Glas liefert keine Tiefe. Folge: Zeile 5 versagt - Glas aus der Slot-Position schätzen, Kamera nur zur Prüfung (Mechanik-Prior B); D405 am Handgelenk für die Feinlage."}
      - {bis: 25.0, name: "B", text: "5 bis 25 %: wenig Tiefe. Folge: Glas-Pose aus der Kontur (RGB-Maske) plus D405; Ensenso-Tiefe nur als Plausibilitätsprüfung."}
      - {bis: 1000.0, name: "A", text: "Ab 25 %: Tiefe auf Glas nutzbar wie im Modell (31 %). Folge: Modellannahme behalten; Durchblickpunkte (Hintergrund hinter dem Glas) in Zeile 7 prüfen."}

