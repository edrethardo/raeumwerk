# Aufbau "auf der Maschine", Variante C2: ReBeL auf der liegenden 7. Achse
# Vorgabe: Raeumwerk macht nur den Oberkorb.
# entlang der Arbeitsplatte, um 105 Grad zum Raum geneigt (schraeg haengend),
# Schiene an der Plattenvorderkante (d = 0). Nur der Oberkorb (Konzept-Spec §14).
#   raeumwerk aufbau beispiele/auf-maschine.yaml
name: Auf der Maschine C2 (Achse entlang der Platte, 105 Grad, d 0)
beschreibung: >-
  ReBeL auf der 7. Achse (Hub 1,0 m, Schiene 1,3 m ab x -0,40) an der
  Vorderkante der Arbeitsplatte (y 0,05), Roboterachse 105 Grad aus der
  Senkrechten zum Raum geneigt, Fuss 0,95 m hoch. Halterung: Ausleger auf der
  Platte, ragt 0,11 m ueber die Kante. Ziele nur im Oberkorb: Korbzug,
  16 Glasplaetze, 8 Dessertteller hochkant (D 19 cm), Ablage auf der Platte
  rechts neben der Maschine (von oben und im Seitgriff).
roboter:
  ursprung_xyz_m: [-0.40, 0.05, 0.953333]   # Schienenanfang; z = 0,86 + 0,11 * 30/45 + 0,02
  gier_grad: 0
  neigung_grad: 105                         # Roboter-z = (0, sin 105, cos 105)
achse:
  richtung: x
  hub_m: 1.0
  schiene: standard
masse:
  glashalter: {reihen_x_m: [0.48, 0.36, 0.24, 0.12], slots_je_reihe: 4}
  ablage: {punkte_xy_m: [[1.00, -0.03], [1.10, -0.03], [1.00, -0.15], [1.10, -0.15]]}
hindernisse:
  - {name: podest, gruppe: halter, lo: [-0.40, -0.25, 0.86], hi: [0.90, 0.16, 0.89]}
erlaubt: ["rail|podest", "carriage|podest", "rail|arbeitsplatte", "carriage|arbeitsplatte", "base_link|podest"]
halter_beruehrt: [arbeitsplatte]           # der Ausleger liegt auf der Platte
ziele:
  zug:
    koerbe: [oberkorb]
    x_m: [0.30]
    griffe: [waagerecht]
    richtungen: [aus, ein]
    anfahrt_m: 0.08
  slots: {oberkorb_auszug_m: 0.45, gier_grad: [0, 180]}
  teller:
    korb: oberkorb
    auszug_m: 0.45
    praefix: teller
    x_m: [0.15, 0.45]
    tiefe_m: [0.07, 0.13, 0.19, 0.25]
    rand_ueber_boden_m: 0.19            # Dessertteller D 19 cm hochkant (EN 50242)
    greif_unter_rand_m: 0.02
    vorposition_m: 0.10
    aushub_m: 0.15
    gier_grad: [90, 0]
    glashalter: false                   # Tellerreihen statt Glashalter
    last_kg: 0.35
  ablage:
    platte: true
    seitgriff: true
    gier_grad: [0, 90, 180, 270]
momente:
  zugkraft_n: [20, 30]
# Referenz (Konzept-Spec §14, C2 bei 105 Grad, d 0): Slots 2/16, Teller 3/8
# (nur rechts), Korbzug ja, Ablage von oben 0/4, im Seitgriff 1/4.
vergleich:
  slots: 2
  teller: 3
  zug_oberkorb: true
  ablage_platte: 0
  ablage_seitgriff: 1
