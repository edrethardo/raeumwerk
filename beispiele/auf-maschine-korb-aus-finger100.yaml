# Owner-Frage: Arm auf der Spuelmaschine (Arbeitsplatte), Oberkorb staendig ausgezogen.
# Beste Lage aus dem Raster (Kantenabstand -0,15..+0,10 m, x 0,20/0,30/0,40 m, Neigung 0/105 Grad,
# ohne/mit 7. Achse) mit igus-Greifer und eigenen 100-mm-Fingern. Wie auf-maschine-korb-aus.yaml,
# aber der Fuss steht 5 cm hinter der Plattenkante (Halterplatte kragt 8 cm ueber die Kante).
#   raeumwerk aufbau beispiele/auf-maschine-korb-aus-finger100.yaml
name: Auf der Maschine, Oberkorb ausgezogen, Finger 100 mm (beste Lage)
beschreibung: >-
  ReBeL ohne Achse auf der Arbeitsplatte ueber der Maschine, Fuss (0,30; 0,00) auf 0,86 m,
  Gesicht zum Raum. Oberkorb fest 0,45 m ausgezogen, kein Korbzug. Glasplaetze entnehmen und
  einsetzen, 8 Dessertteller im Oberkorb, Ablage auf der Platte rechts.
roboter:
  ursprung_xyz_m: [0.30, 0.00, 0.86]
  gier_grad: 0
  neigung_grad: 0
achse:
  richtung: keine
  schiene: platte
greifer:
  finger_laenge_m: 0.10
  finger_masse_kg: 0.083        # 0,05 kg je 60 mm, linear (Annahme)
  griff_ab_spitze_m: 0.03       # TCP = 0,05 + 0,10 - 0,03 = 0,12 m ab Flansch
masse:
  glashalter: {reihen_x_m: [0.48, 0.36, 0.24, 0.12], slots_je_reihe: 4}
  ablage:
    punkte_xy_m: [[0.60, -0.03], [0.72, -0.03], [0.60, -0.15], [0.72, -0.15]]
hindernisse:
  - {name: podest, gruppe: halter, lo: [0.17, 0.05, 0.82], hi: [0.43, 0.13, 0.86]}
erlaubt: ["rail|podest", "carriage|podest", "rail|arbeitsplatte", "carriage|arbeitsplatte",
          "base_link|podest", "base_link|arbeitsplatte"]
halter_beruehrt: [arbeitsplatte]
ziele:
  slots: {oberkorb_auszug_m: 0.45, gier_grad: [0, 180], einsetzen: true}
  teller:
    korb: oberkorb
    auszug_m: 0.45
    praefix: teller
    x_m: [0.15, 0.45]
    tiefe_m: [0.07, 0.13, 0.19, 0.25]
    rand_ueber_boden_m: 0.19
    greif_unter_rand_m: 0.02
    vorposition_m: 0.10
    aushub_m: 0.15
    gier_grad: [90, 0]
    glashalter: false
    last_kg: 0.35
  ablage:
    platte: true
    seitgriff: false
    gier_grad: [0, 90, 180, 270]
momente:
  zugkraft_n: [20, 30]
# Gerechnet mit dem Werkzeug: Glasplaetze 8/16 (vordere zwei Reihen: 1, 2, 5, 6, 9, 10, 13, 14),
# Teller 6/8 (je Spalte die vorderen drei), Ablage Platte 4/4. Original-Finger 60 mm: 2/16, 6/8.
vergleich:
  slots: 8
  teller: 6
  ablage_platte: 4
