# Owner-Frage: Arm auf einem Tisch, Oberkorb staendig ausgezogen. Beste Lage aus dem Raster
# (Tisch frontal vor der offenen Tuer, Hoehe 0,40-0,65 m; Tisch seitlich rechts 0,40-0,65 m,
# Abstand 0,15/0,25 m, y 0,20/0,35/0,50 m). igus-Greifer mit eigenen 100-mm-Fingern.
# Tischplatte kragt ueber die Tuerspitze (Tuer offen bis y 0,64), Beine ab y 0,66.
#   raeumwerk aufbau beispiele/tisch-frontal-korb-aus-finger100.yaml
name: Tisch frontal vor der Tuer, Oberkorb ausgezogen, Hoehe 0,55 m, Finger 100 mm
beschreibung: >-
  ReBeL ohne Achse auf einem Tisch frontal vor der offenen Tuer, Fuss (0,30; 0,60) auf 0,55 m,
  Gesicht zur Maschine. Oberkorb fest 0,45 m ausgezogen, kein Korbzug. Glasplaetze entnehmen
  und einsetzen, 8 Dessertteller im Oberkorb, Ablage auf 4 Glaesern auf demselben Tisch.
roboter:
  ursprung_xyz_m: [0.30, 0.60, 0.55]
  gier_grad: -90
achse:
  richtung: keine
  schiene: platte
greifer:
  finger_laenge_m: 0.10
  finger_masse_kg: 0.083        # 0,05 kg je 60 mm, linear (Annahme)
  griff_ab_spitze_m: 0.03       # TCP = 0,05 + 0,10 - 0,03 = 0,12 m ab Flansch
masse:
  glashalter: {reihen_x_m: [0.48, 0.36, 0.24, 0.12], slots_je_reihe: 4}
hindernisse:
  - {name: podest, gruppe: tisch, lo: [0.15, 0.47, 0.51], hi: [0.75, 0.90, 0.55]}
  - {name: tischbein, gruppe: tisch, lo: [0.15, 0.66, 0.0], hi: [0.75, 0.90, 0.505]}
  - {name: tisch_1, glas_mitte: [0.52, 0.64, 0.605]}
  - {name: tisch_2, glas_mitte: [0.52, 0.76, 0.605]}
  - {name: tisch_3, glas_mitte: [0.64, 0.64, 0.605]}
  - {name: tisch_4, glas_mitte: [0.64, 0.76, 0.605]}
erlaubt: ["base_link|podest", "rail|podest", "carriage|podest"]
halter_beruehrt: [tisch_1, tisch_2, tisch_3, tisch_4]
ik: {zufallsstarts_bei_fehlschlag: 12}
ziele:
  slots: {oberkorb_auszug_m: 0.45, gier_grad: [0, 180], einsetzen: true}
  teller:
    korb: oberkorb
    auszug_m: 0.45
    praefix: teller
    x_m: [0.15, 0.45]
    tiefe_m: [0.07, 0.13, 0.19, 0.25]
    rand_ueber_boden_m: 0.19
    greif_unter_rand_m: 0.02
    vorposition_m: 0.10
    aushub_m: 0.15
    gier_grad: [90, 0]
    glashalter: false
    last_kg: 0.35
  ablage:
    platte: false
    glaeser: [tisch_1, tisch_2, tisch_3, tisch_4]
    gier_grad: [0, 90, 180, 270]
momente:
  zugkraft_n: [20, 30]
# Gerechnet mit dem Werkzeug: Glasplaetze 12/16 (nicht: hinterste Reihe 4, 8, 12, 16),
# Teller 8/8, Ablage 4/4. Original-Finger 60 mm: 6/16, 8/8.
vergleich:
  slots: 12
  teller: 8
  ablage_extra: 4
